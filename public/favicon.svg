<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- Cyan to Blue diagonal gradient for the inner circle -->
    <linearGradient id="dotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5b3" />
      <stop offset="100%" stop-color="#0091ff" />
    </linearGradient>
  </defs>

  <!-- Dark background container -->
  <rect width="100" height="100" fill="#080e14" rx="16" />

  <!-- Outer thin ring -->
  <circle 
    cx="50" 
    cy="50" 
    r="40" 
    fill="none" 
    stroke="#162c38" 
    stroke-width="1.5" 
  />

  <!-- Inner gradient dot -->
  <circle 
    cx="50" 
    cy="50" 
    r="15" 
    fill="url(#dotGradient)" 
  />
</svg>
